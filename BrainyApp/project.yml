name: BrainyApp
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
targets:
  BrainyApp:
    type: application
    platform: macOS
    sources:
      - BrainyApp

    settings:
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: false
      PRODUCT_BUNDLE_IDENTIFIER: com.monk97.brainy
      DEVELOPMENT_TEAM: ""
      SWIFT_VERSION: "5.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: BrainyApp/Info.plist
      properties:
        CFBundleDisplayName: Brainy
        CFBundleName: Brainy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        NSUserNotificationUsageDescription: "Brainy reads your Obsidian vault and Taskwarrior tasks."
        UIApplicationSceneManifest:
          Generation: false
          Platforms: {}
